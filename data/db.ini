# Aetheria Online — DB 백엔드 설정
#
# enabled : 1 이면 SQL Server(ODBC) 사용 시도, 0 이면 JSON 파일 백엔드 사용.
#           SQL Server 연결에 실패하면 자동으로 JSON 파일 백엔드로 폴백한다.
# conn    : ODBC 연결 문자열 (DSN-less). DRIVER 이름은 설치된 SQL Server ODBC 드라이버에
#           맞춰 수정해야 한다.
#           확인 방법: 제어판 > 관리 도구 > ODBC 데이터 원본(64비트) > [드라이버] 탭
#           후보) {ODBC Driver 17 for SQL Server}, {ODBC Driver 18 for SQL Server},
#                 레거시 {SQL Server}
#
# 주의)
#  - ODBC Driver 18 은 기본값이 Encrypt=yes 라서 localhost에 신뢰된 인증서가 없으면 연결 실패한다.
#    이때는 Encrypt=no 또는 TrustServerCertificate=yes 를 추가한다.
#  - SQL 로그인(UID/PWD)을 쓰려면 서버가 "SQL Server 및 Windows 인증 모드"(혼합)여야 한다.
#    스키마: data\schema_mssql.sql 가 로그인 aetheria/aetheria123 을 생성한다.
#  - 원격 서버/명명 인스턴스 예) SERVER=192.168.0.10,1433  또는  SERVER=HOST\SQLEXPRESS
#    원격이면 TCP/IP 활성화 + 방화벽 1433 개방 필요.
#
# 줄 시작이 # 이면 주석. key=value 형식. 값 안의 공백/중괄호 그대로 허용.

enabled=1
conn=DRIVER={ODBC Driver 17 for SQL Server};SERVER=localhost\SQLEXPRESS;DATABASE=aetheria;UID=aetheria;PWD=aetheria123;Encrypt=no;
