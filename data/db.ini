# Aetheria Online — DB 백엔드 설정
#
# enabled : 1 이면 MySQL(ODBC) 사용 시도, 0 이면 JSON 파일 백엔드 사용.
#           MySQL 연결에 실패하면 자동으로 JSON 파일 백엔드로 폴백한다.
# conn    : ODBC 연결 문자열 (DSN-less). DRIVER 이름은 설치된 MySQL ODBC 드라이버에
#           맞춰 수정해야 한다.
#           확인 방법: 제어판 > 관리 도구 > ODBC 데이터 원본(64비트) > [드라이버] 탭
#           예) {MySQL ODBC 9.1 Unicode Driver}, {MySQL ODBC 8.0 Unicode Driver}
#
# 줄 시작이 # 이면 주석. key=value 형식. 값 안의 공백/중괄호 그대로 허용.

enabled=1
conn=DRIVER={MySQL ODBC 9.7 Unicode Driver};SERVER=127.0.0.1;PORT=3306;DATABASE=aetheria;UID=aetheria;PWD=aetheria123;
